version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Oslo"
    allow:
      - dependency-type: "all"
    ignore:
      # Published Qt 5.15.11-5.15.19 wheels do not support Windows.
      # Keep future releases eligible for updates; Windows CI checks compatibility.
      - dependency-name: "pyqt5-qt5"
        versions: [">=5.15.11,<=5.15.19"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    groups:
      python-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
